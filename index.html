<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Platformer Game</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="checkpoint-screen">
      <h2>Congrats!</h2>
      <p>You reached the last checkpoint.</p>
    </div>

    <canvas id="canvas"></canvas>

    <div class="mobile-controls" aria-hidden="true">
      <button class="control-btn" data-action="left" aria-label="Move left">◀</button>
      <button class="control-btn" data-action="jump" aria-label="Jump">⤒</button>
      <button class="control-btn" data-action="right" aria-label="Move right">▶</button>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
